<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'">
    <title>Appian Task</title>

    <!-- Teams JS SDK -->
    <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>

    <!-- Appian Embedded Bootstrap -->
    <script src="https://hsbc-gtrf.appiancloud.com/suite/tempo/ui/sail-client/embeddedBootstrap.nocache.js" id="appianEmbedded" data-signin="https://hsbc-gtrf.appiancloud.com/suite/"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        height: 100vh;
        overflow: hidden;
      }

      #loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 12px;
        color: #555;
        font-size: 14px;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #ddd;
        border-top-color: #0070C0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #task-container {
        display: none;
        height: 100vh;
        overflow: auto;
      }

      appian-task, appian-action {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <div id="loading">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>

    <div id="task-container"></div>

    <script>
      (function () {

        function render(taskId) {
          var el;

          if (taskId) {
            el = document.createElement("appian-task");
            el.setAttribute("taskId", taskId);
          } else {
            el = document.createElement("appian-action");
            el.setAttribute("processModelUuid", "2903d426-0073-468b-a471-fd863144f443");
          }

          var container = document.getElementById("task-container");
          container.appendChild(el);
          container.style.display = "block";
          document.getElementById("loading").style.display = "none";
        }

        microsoftTeams.app.initialize().then(function () {
          microsoftTeams.app.getContext().then(function (context) {
            var taskId = (context && context.page && context.page.subPageId)
              ? context.page.subPageId
              : new URLSearchParams(window.location.search).get("taskId");

            render(taskId);
            microsoftTeams.app.notifySuccess();

          }).catch(function () {
            render(new URLSearchParams(window.location.search).get("taskId"));
          });

        }).catch(function () {
          render(new URLSearchParams(window.location.search).get("taskId"));
        });

      })();
    </script>

  </body>
</html>
